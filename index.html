<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>George Rump</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="registry.js"></script>
</head>
<body>

    <!-- ============================================================
         HEADER
         ============================================================ -->
    <h1><span class="big-letter">W</span>elcome!</h1>
    <div id="header">
        <img id="header-logo" src="/collections/homepage.png" alt="Header image">
    </div>

    <!-- ============================================================
         SIDEBAR – LINK TREE + FLOATING WINDOW + TOOLBAR (grouped)
         ============================================================ -->
    <div id="sidebar">
        <div id="tree-wrapper">

            <!-- Folder links -->
            <div id="treeContent"></div>

            <!-- Floating window (now between folder links and toolbar) -->
            <div id="floating-window">
                 <div class="info-icon-permanent">🛈</div>
                 <div class="file-content"></div>
            </div>

            <!-- Toolbar -->
            <div id="tree-toolbar">
                <a href="#" id="magnifierToggle">
                    <span>Magnifier</span>
                    <img src="collections/homepage/magnifier-icon.png" alt="magnifier icon">
                </a>
                <a href="#" id="darkModeToggle">
                    <span id="darkModeLabel">Dark Mode</span>
                    <img id="darkModeIconLight" src="collections/homepage/dark-icon.png" alt="dark mode icon">
                    <img id="darkModeIconDark" src="collections/homepage/light-icon.png" alt="light mode icon">
                </a>
            </div>

        </div>
    </div>

    <!-- ============================================================
         SIDEBAR TOGGLE TAB
         ============================================================ -->
    <div class="sidebar-tab" id="showTab" title="Toggle sidebar">◀</div>

    <!-- ============================================================
         MAGNIFIER LENS
         ============================================================ -->
    <div id="magnifierLens" aria-hidden="true">
        <canvas></canvas>
        <img id="magnifierCorner" src="collections/homepage/green-corner-icon.png" alt="corner">
    </div>

    <!-- ============================================================
         MAIN CONTENT – IMAGE DISPLAY
         ============================================================ -->
    <div id="mainContent">
        <div id="bookshelfImageArea"></div>
    </div>

    <!-- ============================================================
         JAVASCRIPT – with all fixes applied
         ============================================================ -->
    <script>
        // ============================================================
        // MASTER_IMAGE_REGISTRY loaded from registry.js
        // ============================================================

        let allImages = [];
        let currentIndex = 0;

        // ============================================================
        // GET DESCRIPTION FUNCTION
        // ============================================================
        function getImageDescription(path) {
            if (typeof CUSTOM_DESCRIPTIONS !== 'undefined' && CUSTOM_DESCRIPTIONS[path]) {
                return CUSTOM_DESCRIPTIONS[path];
            }
            const filename = path.split('/').pop();
            const name = filename.replace(/\.[^/.]+$/, '');
            return name.replace(/[-_]/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
        }

        // ============================================================
        // UPDATE ACTIVE FILE (NO SCROLLING - ONLY 1 FILE SHOWN)
        // ============================================================
        function updateActiveFile(activePath) {
            const floatingWin = document.getElementById('floating-window');
            if (!floatingWin) return;

            floatingWin.querySelectorAll('.file-link').forEach(link => {
                link.classList.remove('active');
            });

            floatingWin.querySelectorAll('.file-link').forEach(link => {
                if (link.dataset.path === activePath) {
                    link.classList.add('active');
                }
            });
        }

        function groupAndSortByFolder() {
            const groups = {};
            MASTER_IMAGE_REGISTRY.forEach(path => {
                const parts = path.split('/');
                const folder = parts[1];
                if (!groups[folder]) groups[folder] = [];
                groups[folder].push(path);
            });
            Object.keys(groups).forEach(folder => {
                groups[folder].sort((a, b) => {
                    const numA = a.match(/(\d+)/);
                    const numB = b.match(/(\d+)/);
                    const valA = numA ? parseInt(numA[0], 10) : 0;
                    const valB = numB ? parseInt(numB[0], 10) : 0;
                    return valA - valB;
                });
            });
            return groups;
        }

        function refreshMagnifierIfActive() {
            const lens = document.getElementById('magnifierLens');
            if (lens && !lens.classList.contains('hidden')) {
                if (window._magnifier && typeof window._magnifier.captureScreen === 'function') {
                    window._magnifier.captureScreen();
                }
            }
        }

        function renderSingleImage(url, name) {
            const area = document.getElementById('bookshelfImageArea');
            if (!area) return;
            area.innerHTML = '';
            const img = document.createElement('img');
            img.src = url;
            img.alt = name;
            area.appendChild(img);
            updateActiveFile(url);
            refreshMagnifierIfActive();
        }

        function renderToBookshelf(content, single = false, title = '') {
            const area = document.getElementById('bookshelfImageArea');
            if (!area) return;
            area.innerHTML = '';
            if (single && typeof content === 'string') {
                const f = content.split('/').pop();
                const n = f.replace(/\.[^/.]+$/, '');
                renderSingleImage(content, n);
                refreshMagnifierIfActive();
                return;
            }
            if (Array.isArray(content) && content.length) {
                const first = content[0];
                const f = first.split('/').pop();
                const n = f.replace(/\.[^/.]+$/, '');
                renderSingleImage(first, n);
                refreshMagnifierIfActive();
                return;
            }
            area.innerHTML = '<p style="padding:40px;color:#666;">' + (title || 'No images') + '</p>';
            refreshMagnifierIfActive();
        }

        function buildTree() {
            const container = document.getElementById('treeContent');
            if (!container) return;
            container.innerHTML = '';

            const grouped = groupAndSortByFolder();
            const folderNames = Object.keys(grouped);
            const filteredFolders = folderNames.filter(folder => folder !== 'homepage');

            if (filteredFolders.length === 0) {
                container.innerHTML = '<p style="padding:10px;color:#666;">No images found</p>';
                return;
            }

            allImages = [];
            filteredFolders.forEach(folder => {
                allImages = allImages.concat(grouped[folder]);
            });
            currentIndex = 0;

            let html = '<table class="dir-table"><tbody>';

            filteredFolders.forEach((folder) => {
                const imagePaths = grouped[folder];
                const firstImage = imagePaths[0] || '';

                html += `
                    <tr class="folder-row" data-folder="${folder}" data-first="${firstImage}">
                        <td>
                            <span class="arrow">></span>
                            <span>${folder}/</span>
                        </td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            container.innerHTML = html;

            container.querySelectorAll('.folder-row[data-folder]').forEach(row => {
                const folder = row.dataset.folder;
                const firstImage = row.dataset.first;
                const arrow = row.querySelector('.arrow');

                row.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();

                    arrow.classList.toggle('open');

                    if (firstImage) {
                        const grouped = groupAndSortByFolder();
                        allImages = grouped[folder] || [];
                        currentIndex = 0;
                        renderToBookshelf(firstImage, true);
                        updateFloatingWindow(folder);
                    }
                });
            });
        }

        // ============================================================
        // FLOATING WINDOW - Show ONE file + description ONLY!
        // ============================================================
        function updateFloatingWindow(folder) {
            const floatingWin = document.getElementById('floating-window');
            if (!floatingWin) return;

            const grouped = groupAndSortByFolder();
            const imagePaths = grouped[folder] || [];

            if (imagePaths.length === 0) {
                floatingWin.innerHTML = '';
                floatingWin.style.display = 'none';
                return;
            }

            floatingWin.dataset.paths = JSON.stringify(imagePaths);
            floatingWin.dataset.currentIndex = '0';

            showFileAtIndex(floatingWin, 0);
            floatingWin.style.display = 'block';
        }

        // ============================================================
        // SHOW FILE - YOUR EXACT STYLE! JUST ONE FILE!
        // ============================================================
        function showFileAtIndex(floatingWin, index) {
            const paths = JSON.parse(floatingWin.dataset.paths);
            const path = paths[index];
            const fileName = path.split('/').pop();
            const description = getImageDescription(path);
        
            // Target the .file-content container (not the whole floating window)
            const contentContainer = floatingWin.querySelector('.file-content');
            if (!contentContainer) return;
        
            contentContainer.innerHTML = `
                <a href="#" class="file-link active" data-path="${path}">
                    <span class="file-name">${fileName}</span>
                    <span class="file-description">${description}</span>
                </a>
            `;
        
            floatingWin.dataset.currentPath = path;
            floatingWin.dataset.currentIndex = index;
        
            const f = path.split('/').pop();
            const n = f.replace(/\.[^/.]+$/, '');
            renderSingleImage(path, n);
            updateActiveFile(path);
        }
        
        // ============================================================
        // NAVIGATE FLOATING WINDOW
        // ============================================================
        function navigateFloatingWindow(floatingWin, dir) {
            const paths = JSON.parse(floatingWin.dataset.paths);
            let index = parseInt(floatingWin.dataset.currentIndex) + dir;
            if (index < 0) index = paths.length - 1;
            if (index >= paths.length) index = 0;
            showFileAtIndex(floatingWin, index);
        }

        // ============================================================
        // ARROW KEY NAVIGATION
        // ============================================================
        document.addEventListener('keydown', function(e) {
            const floatingWin = document.getElementById('floating-window');
            if (!floatingWin || floatingWin.style.display === 'none') return;

            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                navigateFloatingWindow(floatingWin, -1);
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                navigateFloatingWindow(floatingWin, 1);
            }
        });

        // ============================================================
        // SIDEBAR TOGGLE
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            const sidebar = document.getElementById('sidebar');
            const showTab = document.getElementById('showTab');
            const mainContent = document.getElementById('mainContent');

            if (!sidebar || !showTab || !mainContent) {
                console.error('Sidebar toggle: missing elements');
                return;
            }

            let visible = true;

            showTab.addEventListener('click', function(e) {
                e.stopPropagation();
                visible = !visible;

                sidebar.classList.toggle('hidden-sidebar', !visible);

                showTab.textContent = visible ? '◀' : '▶';
                mainContent.style.marginLeft = visible ? 'auto' : '0';
                console.log('Sidebar visible:', visible);
            });

            console.log('Sidebar toggle ready');
        });

        // ============================================================
        // MAGNIFIER
        // ============================================================
        (function() {
            const toggle = document.getElementById('magnifierToggle');
            const lens = document.getElementById('magnifierLens');
            const body = document.body;
            let snapshot = null;
            const zoom = 2;
            let lx = 300,
                ly = 300,
                dragging = false,
                sx, sy, slx, sly;
            let captureInProgress = false;

            function updateSnapshot() {
                if (!snapshot) return;
                const w = lens.offsetWidth,
                    h = lens.offsetHeight;
                const srcX = (lx + w / 2) * zoom - w / 2;
                const srcY = (ly + h / 2) * zoom - h / 2;
                snapshot.style.transform = 'translate(' + (-srcX) + 'px, ' + (-srcY) + 'px) scale(' + zoom + ')';
                snapshot.style.transformOrigin = '0 0';
            }

            async function captureScreen() {
                if (captureInProgress) return;
                captureInProgress = true;
                try {
                    const canvas = await html2canvas(document.body, {
                        useCORS: true,
                        scale: zoom,
                        width: window.innerWidth,
                        height: window.innerHeight,
                        windowWidth: window.innerWidth,
                        windowHeight: window.innerHeight,
                        scrollX: window.scrollX,
                        scrollY: window.scrollY,
                        x: window.scrollX,
                        y: window.scrollY,
                        ignoreElements: function(element) {
                            return element.id === 'magnifierLens';
                        },
                        logging: false
                    });
                    snapshot = canvas;
                    snapshot.style.position = 'absolute';
                    snapshot.style.top = '0';
                    snapshot.style.left = '0';
                    lens.innerHTML = '';
                    lens.appendChild(canvas);
                    updateSnapshot();
                } catch (err) {
                    console.warn('Magnifier capture failed', err);
                } finally {
                    captureInProgress = false;
                }
            }

            window._magnifier = { captureScreen: captureScreen };

            if (toggle && lens) {
                toggle.addEventListener('click', function(e) {
                    e.preventDefault();
                    body.classList.toggle('magnifier-mode');
                    if (body.classList.contains('magnifier-mode')) {
                        lens.classList.remove('hidden');
                        lx = 300;
                        ly = 300;
                        lens.style.left = lx + 'px';
                        lens.style.top = ly + 'px';
                        captureScreen();
                    } else {
                        lens.classList.add('hidden');
                    }
                });

                lens.addEventListener('pointerdown', function(e) {
                    dragging = true;
                    sx = e.clientX;
                    sy = e.clientY;
                    slx = lx;
                    sly = ly;
                    lens.setPointerCapture(e.pointerId);
                });
                lens.addEventListener('pointermove', function(e) {
                    if (!dragging) return;
                    lx = slx + (e.clientX - sx);
                    ly = sly + (e.clientY - sy);
                    lens.style.left = lx + 'px';
                    lens.style.top = ly + 'px';
                    updateSnapshot();
                });
                lens.addEventListener('pointerup', function() { dragging = false; });
                lens.addEventListener('pointercancel', function() { dragging = false; });

                let scrollTimer;
                window.addEventListener('scroll', function() {
                    if (body.classList.contains('magnifier-mode')) {
                        clearTimeout(scrollTimer);
                        scrollTimer = setTimeout(captureScreen, 200);
                    }
                });
                let resizeTimer;
                window.addEventListener('resize', function() {
                    if (body.classList.contains('magnifier-mode')) {
                        clearTimeout(resizeTimer);
                        resizeTimer = setTimeout(captureScreen, 200);
                    }
                });
            }
        })();

        // ============================================================
        // DARK MODE
        // ============================================================
        (function() {
            const toggle = document.getElementById('darkModeToggle');
            const body = document.body;
            const label = document.getElementById('darkModeLabel');

            function applyDark(isDark) {
                body.classList.toggle('dark-mode', isDark);
                if (label) {
                    label.textContent = isDark ? 'Light Mode' : 'Dark Mode';
                }
                localStorage.setItem('darkMode', isDark);
            }

            if (localStorage.getItem('darkMode') === 'true') {
                applyDark(true);
            }
            if (toggle) {
                toggle.addEventListener('click', function(e) {
                    e.preventDefault();
                    applyDark(!body.classList.contains('dark-mode'));
                });
            }
        })();

        // ============================================================
        // LOAD DEFAULT
        // ============================================================
        window.addEventListener('load', function() {
            buildTree();
        });

    </script>

</body>
</html>
