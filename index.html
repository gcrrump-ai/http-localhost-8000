
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<body>
    <div id="content-wrapper">

        <div id="sidebar">
            <button type="button" id="sortByToggle" aria-label="Sort links">[Sortby] <span id="sortByState">{:}</span></button>
            <div class="tree-content" id="treeDropdownContent" tabindex="0"></div>
            <div id="floating-window">
                <div class="dev-tooltip-exact">
                    <div class="file-content"></div>
                </div>
            </div>
            <div id="tree-toolbar">
                <a href="#" id="magnifierToggle" aria-label="Toggle magnifier">
                    <img src="assets/magnifier-icon.png" alt="magnifier icon">
                </a>
                <a href="#" id="darkModeToggle" aria-label="Toggle dark mode">
                    <img id="darkModeIconLight" src="assets/dark-icon.png" alt="dark mode icon">
                    <img id="darkModeIconDark" src="assets/light-icon.png" alt="light mode icon">
                </a>
                <a href="#" id="expandImageToggle" aria-label="Expand image">E</a>
            </div>
        </div>

        <div id="mainContent">
            <div id="bookshelfImageArea">
                <div id="intro-text">
                    <div id="intro-title"><span class="big-letter">W</span>elcome!</div>
                    <div>Select any image to enter Swipe or Press(←↑↓→) keys to navigate.
					                                                              
					</div>
                    <div>
                        <div>All Rights Reserved Copyright © Photographs by George Rump.</div>
                        <div>email; gcrrump@gmail.com</div>
                    </div>
                </div>
            </div>
<div id="mobile-under-image"></div>
        </div>

    </div>

    <a href="#" id="returnHomeControl" aria-label="Return home" title="Return home"><img src="assets/return-icon.png" alt="Return home"></a>
    <div class="sidebar-tab" id="showTab" title="Toggle sidebar">◀</div>

    <div id="magnifierLens" aria-hidden="true">
        <canvas></canvas>
    </div>

<script>
/* ============================================================
   APP
   ============================================================ */

let globalImageList = [];
let originalImageList = [];
let globalCurrentIndex = 0;
let sortByMode = 0; // 0 = original, 1 = alphabetical, 2 = numerical

let imageMetadataByPath = Object.create(null);
let metadataServerAvailable = false;
const METADATA_SERVER_URL = 'http://localhost:8001';

async function loadImageMetadata() {
    try {
        const response = await fetch(METADATA_SERVER_URL + '/metadata', { cache: 'no-store' });
        if (!response.ok) throw new Error('Metadata server returned ' + response.status);
        const payload = await response.json();
        imageMetadataByPath = Object.create(null);
        (payload.images || []).forEach(function(record) {
            if (record && record.path) imageMetadataByPath[record.path] = record;
        });
        metadataServerAvailable = true;
    } catch (error) {
        metadataServerAvailable = false;
        console.warn('Image metadata server is unavailable. Metadata editing is disabled.', error);
    }
}

function formatFileSize(bytes) {
    const value = Number(bytes);
    if (!Number.isFinite(value) || value < 0) return '';
    if (value < 1024) return value + ' B';
    if (value < 1024 * 1024) return (value / 1024).toFixed(1) + ' KB';
    if (value < 1024 * 1024 * 1024) return (value / (1024 * 1024)).toFixed(2) + ' MB';
    return (value / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
}

function addMetadataReadOnlyRow(container, label, value) {
    if (value === undefined || value === null || value === '') return;
    const row = document.createElement('div');
    row.className = 'row-exact body-row metadata-row';
    const name = document.createElement('span');
    name.className = 'metadata-label';
    name.textContent = label;
    const text = document.createElement('span');
    text.className = 'value-exact metadata-value';
    text.textContent = String(value);
    row.append(name, text);
    container.appendChild(row);
}

function addMetadataEditRow(container, label, fieldName, value, multiline, inputType) {
    const row = document.createElement('div');
    row.className = 'row-exact body-row metadata-row metadata-edit-row';
    const name = document.createElement('label');
    name.className = 'metadata-label';
    name.textContent = label;
    const input = document.createElement(multiline ? 'textarea' : 'input');
    input.className = 'metadata-edit-input';
    if (inputType) {
        input.type = inputType;
        if (inputType === 'color') input.classList.add('metadata-color-input');
    }
    input.dataset.metadataField = fieldName;
    input.value = value || '';
    input.disabled = !metadataServerAvailable;
    if (multiline) input.rows = 3;
    row.append(name, input);
    container.appendChild(row);
    return input;
}

function normalizeImageLinkColor(value) {
    return typeof value === 'string' && /^#[0-9a-f]{6}$/i.test(value) ? value : '';
}

function applyImageLinkColor(link, path) {
    if (!link) return;
    const metadata = imageMetadataByPath[path] || {};
    const color = normalizeImageLinkColor(metadata.linkColor);
    if (color) link.style.setProperty('color', color, 'important');
    else link.style.removeProperty('color');
}

function updateImageLinkColor(path, color) {
    const link = Array.from(document.querySelectorAll('#treeDropdownContent a[data-image-path]'))
        .find(function(item) { return item.dataset.imagePath === path; });
    if (!link) return;
    const normalized = normalizeImageLinkColor(color);
    if (normalized) link.style.setProperty('color', normalized, 'important');
    else link.style.removeProperty('color');
}

async function saveImageMetadata(path, id, fields, button) {
    if (!metadataServerAvailable || !id) return;
    button.disabled = true;
    button.textContent = 'Saving…';
    try {
        const response = await fetch(METADATA_SERVER_URL + '/save-metadata', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: id, title: fields.title, description: fields.description, originalFolder: fields.originalFolder, linkColor: fields.linkColor })
        });
        const result = await response.json();
        if (!response.ok || !result.ok) throw new Error(result.error || ('Save failed: ' + response.status));
        imageMetadataByPath[path] = result.image;
        const link = Array.from(document.querySelectorAll('#treeDropdownContent a[data-image-path]')).find(function(item) { return item.dataset.imagePath === path; });
        if (link) link.textContent = result.image.title || path.split('/').pop().replace(/\.[^/.]+$/, '');
        updateImageLinkColor(path, result.image.linkColor || '');
        button.textContent = 'Saved';
    } catch (error) {
        console.error('Could not save image metadata:', error);
        button.textContent = 'Save failed';
    } finally {
        button.disabled = !metadataServerAvailable;
    }
}

function naturalImagePathCompare(a, b) {
    // Sort the single flat image list naturally by filename.
    return a.split('/').pop().localeCompare(b.split('/').pop(), undefined, {
        numeric: true,
        sensitivity: 'base'
    });
}

function isGalleryImagePath(path) {
    const parts = String(path).replace(/\\/g, '/').split('/');
    return parts.length === 2 && parts[0].toLowerCase() === 'collections' &&
        /\.(jpg|jpeg|png|gif|webp)$/i.test(parts[1]);
}

function buildGlobalImageList() {
    return MASTER_IMAGE_REGISTRY
        .filter(isGalleryImagePath)
        .slice()
        .sort(naturalImagePathCompare);
}

function applySortByMode() {
    const currentPath = globalImageList[globalCurrentIndex] ||
        document.getElementById('floating-window')?.dataset.currentPath || null;
    if (sortByMode === 0) {
        globalImageList = originalImageList.slice();
    } else if (sortByMode === 1) {
        globalImageList = originalImageList.slice().sort(function(a, b) {
            return a.split('/').pop().localeCompare(b.split('/').pop(), undefined, {
                numeric: false, sensitivity: 'base'
            });
        });
    } else {
        globalImageList = originalImageList.slice().sort(function(a, b) {
            return a.split('/').pop().localeCompare(b.split('/').pop(), undefined, {
                numeric: true, sensitivity: 'base'
            });
        });
    }
    globalCurrentIndex = currentPath ? globalImageList.indexOf(currentPath) : 0;
    if (globalCurrentIndex < 0) globalCurrentIndex = 0;
    const floatingWin = document.getElementById('floating-window');
    if (floatingWin && floatingWin.dataset.currentPath) {
        floatingWin.dataset.paths = JSON.stringify(globalImageList);
        floatingWin.dataset.currentIndex = globalCurrentIndex;
    }
    buildTreeDropdown();
    if (currentPath) highlightActiveLink(currentPath);
    updateSortByButton();
}

function updateSortByButton() {
    const state = document.getElementById('sortByState');
    if (!state) return;

    if (sortByMode === 1) {
        state.textContent = 'ABC';
    } else if (sortByMode === 2) {
        state.textContent = '123';
    } else {
        state.textContent = '{:}';
    }
}

function navigateToIndex(index) {
    if (index < 0 || index >= globalImageList.length) return;
    globalCurrentIndex = index;
    const path = globalImageList[index];
    if (path) loadImageAndUpdateFloating(path, true);
}

function navigate(direction) {
    const newIndex = globalCurrentIndex + direction;
    if (newIndex < 0 || newIndex >= globalImageList.length) return;
    navigateToIndex(newIndex);
}

function loadImageAndUpdateFloating(imagePath, fromNavigation) {
    const idx = globalImageList.indexOf(imagePath);
    if (idx < 0) return;
    globalCurrentIndex = idx;

    const floatingWin = document.getElementById('floating-window');
    if (floatingWin) {
        // Discard an unsaved colour preview when leaving the previous image.
        const previousPath = floatingWin.dataset.currentPath;
        if (previousPath && previousPath !== imagePath) {
            const previousMetadata = imageMetadataByPath[previousPath] || {};
            updateImageLinkColor(previousPath, previousMetadata.linkColor || '');
        }
        floatingWin.dataset.paths = JSON.stringify(globalImageList);
        floatingWin.dataset.currentIndex = idx;
        renderToBookshelf(imagePath, true, '', function() {
            showFileAtIndex(floatingWin, idx);
            floatingWin.style.display = 'block';
            if (!window.matchMedia('(max-width: 480px)').matches) {
                const toolbar = document.getElementById('tree-toolbar');
                if (toolbar) toolbar.style.display = 'flex';
            }
            document.body.classList.add('image-open');
            highlightActiveLink(imagePath);
            refreshMagnifierIfActive();
            preloadNearbyImages();
            positionFloatingWindow();
            positionLeftControls();
        });
    } else {
        renderToBookshelf(imagePath, true);
    }
}

function refreshMagnifierIfActive() {
    const lens = document.getElementById('magnifierLens');
    if (lens && document.body.classList.contains('magnifier-mode')) {
        if (window._magnifier && typeof window._magnifier.captureScreen === 'function') {
            requestAnimationFrame(function() {
                requestAnimationFrame(function() {
                    window._magnifier.captureScreen();
                });
            });
        }
    }
}

function preloadNearbyImages() {
    const preloadIndexes = [globalCurrentIndex - 1, globalCurrentIndex + 1, globalCurrentIndex + 2];
    preloadIndexes.forEach(function(index) {
        if (index >= 0 && index < globalImageList.length) {
            const preload = new Image();
            preload.src = globalImageList[index];
        }
    });
}

function preloadFirstImages() {
    globalImageList.slice(0, 2).forEach(function(path) {
        const preload = new Image();
        preload.src = path;
    });
}

function renderSingleImage(url, name, callback) {
    const area = document.getElementById('bookshelfImageArea');
    if (!area) return;
    area.innerHTML = '';
    const img = document.createElement('img');
    let settled = false;
    function finish() {
        if (settled) return;
        settled = true;
        if (callback) callback();
    }
    img.alt = name;
    img.onload = finish;
    img.onerror = function() {
        if (settled) return;
        settled = true;
        area.innerHTML = '<p class="image-load-error">Image could not be loaded: ' + name.replace(/[&<>"']/g, '') + '</p>';
    };
    area.appendChild(img);
    img.src = url;
    if (img.complete && img.naturalWidth > 0) setTimeout(finish, 0);
    refreshMagnifierIfActive();
}

function renderToBookshelf(content, single, title, callback) {
    if (single === undefined) single = false;
    if (title === undefined) title = '';
    const area = document.getElementById('bookshelfImageArea');
    if (!area) return;
    area.innerHTML = '';
    if (single && typeof content === 'string') {
        const f = content.split('/').pop();
        const n = f.replace(/\.[^/.]+$/, '');
        renderSingleImage(content, n, callback);
        return;
    }
    if (Array.isArray(content) && content.length) {
        const first = content[0];
        const f = first.split('/').pop();
        const n = f.replace(/\.[^/.]+$/, '');
        renderSingleImage(first, n, callback);
        return;
    }
    area.innerHTML = '<p style="padding:40px;color:#666;">' + (title || 'No images') + '</p>';
    refreshMagnifierIfActive();
    if (callback) callback();
}

function highlightActiveLink(activePath) {
    const tree = document.getElementById('treeDropdownContent');
    if (tree) tree.dataset.keyboardPath = activePath || '';

    document.querySelectorAll('#treeDropdownContent a[data-image-path]').forEach(function(link) {
        link.classList.remove('active');
        link.removeAttribute('aria-current');
        if (activePath && link.dataset.imagePath === activePath) {
            link.classList.add('active');
            link.setAttribute('aria-current', 'true');
        }
    });
}

function showFileAtIndex(floatingWin, index) {
    const paths = JSON.parse(floatingWin.dataset.paths || '[]');
    const path = paths[index];
    if (!path) return;

    const metadata = imageMetadataByPath[path] || {};
    const title = metadata.title || getImageTitle(path);
    const description = metadata && Object.prototype.hasOwnProperty.call(metadata, 'description')
        ? metadata.description
        : getImageDescription(path);
    const imgElement = document.querySelector('#bookshelfImageArea img');
    const dimensions = imgElement && imgElement.naturalWidth && imgElement.naturalHeight
        ? imgElement.naturalWidth + ' × ' + imgElement.naturalHeight
        : (metadata.dimensions || '— × —');
    const content = floatingWin.querySelector('.file-content');
    if (!content) return;
    content.replaceChildren();

    const firstRow = document.createElement('div');
    firstRow.className = 'row-exact';
    const iconAndTag = document.createElement('span');
    iconAndTag.className = 'icon-and-tag';
    const tag = document.createElement('span');
    tag.className = 'tag-exact';
    tag.textContent = 'img';
    iconAndTag.appendChild(tag);
    const dimensionText = document.createElement('span');
    dimensionText.className = 'dim-exact';
    dimensionText.textContent = dimensions;
    firstRow.append(iconAndTag, dimensionText);
    content.appendChild(firstRow);

    const divider = document.createElement('div');
    divider.className = 'divider-wrapper';
    const line = document.createElement('div');
    line.className = 'line-exact';
    divider.appendChild(line);
    content.appendChild(divider);

    addMetadataEditRow(content, 'Title', 'title', title, false);
    addMetadataEditRow(content, 'Description', 'description', description, true);
    addMetadataEditRow(content, 'Original folder', 'originalFolder', metadata.originalFolder || '', false);
    const linkColorInput = addMetadataEditRow(content, 'Link colour', 'linkColor', normalizeImageLinkColor(metadata.linkColor) || '#0000ee', false, 'color');
    linkColorInput.addEventListener('input', function() {
        // Preview immediately; the Save changes button persists the colour on the local server.
        updateImageLinkColor(path, linkColorInput.value);
    });

    addMetadataReadOnlyRow(content, 'Filename', metadata.fileName || path.split('/').pop());
    addMetadataReadOnlyRow(content, 'Format', metadata.format || path.split('.').pop().toUpperCase());
    addMetadataReadOnlyRow(content, 'File size', formatFileSize(metadata.sizeBytes));
    addMetadataReadOnlyRow(content, 'Last modified', metadata.lastModified ? new Date(metadata.lastModified).toLocaleString() : '');

    const exif = metadata.exif || {};
    addMetadataReadOnlyRow(content, 'Camera make', exif.cameraMake);
    addMetadataReadOnlyRow(content, 'Camera model', exif.cameraModel);
    addMetadataReadOnlyRow(content, 'Lens', exif.lensModel);
    addMetadataReadOnlyRow(content, 'Date taken', exif.dateTaken);
    addMetadataReadOnlyRow(content, 'Exposure', exif.exposureTime);
    addMetadataReadOnlyRow(content, 'Aperture', exif.aperture);
    addMetadataReadOnlyRow(content, 'ISO', exif.iso);
    addMetadataReadOnlyRow(content, 'Focal length', exif.focalLength);
    addMetadataReadOnlyRow(content, 'Orientation', exif.orientation);

    const saveRow = document.createElement('div');
    saveRow.className = 'metadata-save-row';
    const saveButton = document.createElement('button');
    saveButton.type = 'button';
    saveButton.className = 'metadata-save-button';
    saveButton.textContent = metadataServerAvailable ? 'Save changes' : 'Server offline — editing unavailable';
    saveButton.disabled = !metadataServerAvailable || !metadata.id;
    saveButton.addEventListener('click', function() {
        const fields = {};
        content.querySelectorAll('[data-metadata-field]').forEach(function(field) {
            fields[field.dataset.metadataField] = field.value;
        });
        saveImageMetadata(path, metadata.id, fields, saveButton);
    });
    saveRow.appendChild(saveButton);
    content.appendChild(saveRow);

    // Update dimensions only for this exact image after its load completes.
    if (imgElement && !imgElement.complete) {
        imgElement.addEventListener('load', function updateDimensions() {
            if (floatingWin.dataset.currentPath !== path) return;
            dimensionText.textContent = imgElement.naturalWidth + ' × ' + imgElement.naturalHeight;
        }, { once: true });
    }
    floatingWin.dataset.currentPath = path;
    floatingWin.dataset.currentIndex = index;
}

function getImageTitle(path) {
    const key = String(path).replace(/\\/g, '/');
    const metadata = imageMetadataByPath[key];
    if (metadata && metadata.title) return metadata.title;
    if (typeof IMAGE_TITLES !== 'undefined' && IMAGE_TITLES[key]) return IMAGE_TITLES[key];
    return key.split('/').pop().replace(/\.[^/.]+$/, '');
}

function getImageDescription(path) {
    const key = String(path).replace(/\\/g, '/');
    const metadata = imageMetadataByPath[key];
    if (metadata && Object.prototype.hasOwnProperty.call(metadata, 'description')) return metadata.description;
    return typeof IMAGE_DESCRIPTIONS !== 'undefined' && IMAGE_DESCRIPTIONS[key]
        ? IMAGE_DESCRIPTIONS[key]
        : '';
}

function returnToGalleryIntro() {
    const imageArea = document.getElementById('bookshelfImageArea');
    if (imageArea) {
        imageArea.innerHTML =
            '<div id="intro-text">' +
                '<div id="intro-title"><span class="big-letter">W</span>elcome!</div>' +
                '<div>Select any image and Swipe or Press Arrow keys (\u2190, \u2192) to navigate through entire collection.</div>' +
                '<div><div>All Rights Reserved Copyright \u00a9 Photographs by George Rump.</div><div>email; gcrrump@gmail.com</div></div>' +
            '</div>';
    }
    const floatingWin = document.getElementById('floating-window');
    if (floatingWin) {
        delete floatingWin.dataset.paths;
        delete floatingWin.dataset.currentIndex;
        delete floatingWin.dataset.currentPath;
        floatingWin.style.display = 'none';
    }
    globalCurrentIndex = 0;
    document.body.classList.remove('image-open', 'expand-image');
    document.body.style.removeProperty('--expand-reserve-right');
    desktopStackLeft = null;
    highlightActiveLink(null);
    if (!window.matchMedia('(max-width: 480px)').matches) {
        const toolbar = document.getElementById('tree-toolbar');
        if (toolbar) toolbar.style.display = 'none';
    }
    requestAnimationFrame(positionLeftControls);
}

function buildTreeDropdown() {
    const treeContent = document.getElementById('treeDropdownContent');
    if (!treeContent) return;
    treeContent.replaceChildren();

    const linksContainer = document.createElement('span');
    linksContainer.className = 'image-links';

    globalImageList.forEach(function(path) {
        const link = document.createElement('a');
        link.href = path;
        link.textContent = getImageTitle(path);
        link.dataset.imagePath = path;
        applyImageLinkColor(link, path);
        link.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            const selectedPath = this.dataset.imagePath;
            treeContent.dataset.keyboardPath = selectedPath;
            highlightActiveLink(selectedPath);
            loadImageAndUpdateFloating(selectedPath, false);
        });
        linksContainer.appendChild(link);
    });

    treeContent.appendChild(linksContainer);
}

function getVisibleTreeImageLinks() {
    const tree = document.getElementById('treeDropdownContent');
    if (!tree || document.body.classList.contains('tree-hidden')) return [];
    if (!tree.getClientRects().length || getComputedStyle(tree).visibility === 'hidden') return [];
    return Array.from(tree.querySelectorAll('.image-links a[href]')).filter(function(link) {
        const style = getComputedStyle(link);
        return style.display !== 'none' && style.visibility !== 'hidden' && !!link.getClientRects().length;
    });
}

function openTreeImageLink(link) {
    if (!link) return false;
    const tree = document.getElementById('treeDropdownContent');
    const path = link.dataset.imagePath || link.getAttribute('href');
    if (!path) return false;

    // Track the selected file without focusing the anchor. This avoids the
    // browser's rectangular keyboard-focus frame and keeps the tree as text.
    if (tree) tree.dataset.keyboardPath = path;
    highlightActiveLink(path);
    loadImageAndUpdateFloating(path, false);
    return true;
}

function navigateTreeSequence(direction) {
    // Left/Right use the same ordered collection list as the tree, rather than
    // relying on the links' screen positions or focus state.
    if (!globalImageList.length) return false;

    const tree = document.getElementById('treeDropdownContent');
    const floatingWin = document.getElementById('floating-window');
    const currentPath = (tree && tree.dataset.keyboardPath) ||
        (floatingWin && floatingWin.dataset.currentPath) || '';
    let currentIndex = currentPath ? globalImageList.indexOf(currentPath) : -1;

    let nextIndex;
    if (currentIndex < 0) {
        nextIndex = direction > 0 ? 0 : globalImageList.length - 1;
    } else {
        nextIndex = currentIndex + direction;
    }

    // Stop at the first and last files; do not wrap unexpectedly.
    if (nextIndex < 0 || nextIndex >= globalImageList.length) return true;

    const nextPath = globalImageList[nextIndex];
    if (tree) tree.dataset.keyboardPath = nextPath;
    highlightActiveLink(nextPath);
    navigateToIndex(nextIndex);
    return true;
}

function navigateTreeByLine(direction) {
    // Up/Down move to the nearest file link on the adjacent rendered line.
    const links = getVisibleTreeImageLinks();
    if (!links.length) return false;

    const tree = document.getElementById('treeDropdownContent');
    const floatingWin = document.getElementById('floating-window');
    const currentPath = (tree && tree.dataset.keyboardPath) ||
        (floatingWin && floatingWin.dataset.currentPath) || '';
    const current = currentPath ? links.find(function(link) {
        return (link.dataset.imagePath || link.getAttribute('href')) === currentPath;
    }) : null;

    if (!current) {
        return openTreeImageLink(direction > 0 ? links[0] : links[links.length - 1]);
    }

    const currentRect = current.getBoundingClientRect();
    const currentX = currentRect.left + currentRect.width / 2;
    const currentY = currentRect.top + currentRect.height / 2;
    const candidates = [];

    links.forEach(function(link) {
        if (link === current) return;
        const rects = Array.from(link.getClientRects());
        rects.forEach(function(rect) {
            const dx = Math.abs((rect.left + rect.width / 2) - currentX);
            const dy = (rect.top + rect.height / 2) - currentY;
            const verticalGap = dy * direction;
            if (verticalGap > 2) {
                candidates.push({ link: link, verticalGap: verticalGap, horizontalGap: dx });
            }
        });
    });

    candidates.sort(function(a, b) {
        // First choose the nearest line; then the link nearest the current x-position.
        return a.verticalGap - b.verticalGap || a.horizontalGap - b.horizontalGap;
    });

    if (candidates.length) openTreeImageLink(candidates[0].link);
    return true;
}

window.addEventListener('keydown', function(e) {
    if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    const target = e.target;
    if (target && (target.isContentEditable || /^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(target.tagName))) return;

    if (!['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) return;
    e.preventDefault();
    e.stopPropagation();

    if (e.key === 'ArrowRight') {
        navigateTreeSequence(1);
    } else if (e.key === 'ArrowLeft') {
        navigateTreeSequence(-1);
    } else if (e.key === 'ArrowDown') {
        if (!navigateTreeByLine(1)) navigate(1);
    } else if (e.key === 'ArrowUp') {
        if (!navigateTreeByLine(-1)) navigate(-1);
    }
}, true);

let touchStartX = 0;
let touchStartY = 0;
let isSwiping = false;
const swipeThreshold = 50;

document.addEventListener('touchstart', function(e) {
    const touch = e.touches[0];
    touchStartX = touch.clientX;
    touchStartY = touch.clientY;
    isSwiping = true;
}, { passive: true });

document.addEventListener('touchmove', function(e) {
    if (!isSwiping) return;
    const touch = e.touches[0];
    const deltaX = touch.clientX - touchStartX;
    const deltaY = touch.clientY - touchStartY;
    if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 10) {
        e.preventDefault();
    }
}, { passive: false });

document.addEventListener('touchend', function(e) {
    if (!isSwiping) return;
    isSwiping = false;
    const touch = e.changedTouches[0];
    const deltaX = touch.clientX - touchStartX;
    const deltaY = touch.clientY - touchStartY;
    if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > swipeThreshold) {
        if (deltaX < 0) navigate(1);
        else navigate(-1);
    }
}, { passive: true });

document.addEventListener('DOMContentLoaded', function() {
    const sidebar = document.getElementById('sidebar');
    const showTab = document.getElementById('showTab');
    const mainContent = document.getElementById('mainContent');
    const sortButton = document.getElementById('sortByToggle');
    const homeButton = document.getElementById('returnHomeControl');
    let visible = true;

    if (sortButton) {
        sortButton.addEventListener('click', function() {
            sortByMode = (sortByMode + 1) % 3;
            applySortByMode();
        });
    }

    if (homeButton) {
        homeButton.addEventListener('click', function(e) {
            e.preventDefault();
            returnToGalleryIntro();
        });
    }

    showTab.textContent = '[Hide]';
    showTab.style.setProperty('color', '#800080', 'important');

    showTab.addEventListener('click', function(e) {
        e.stopPropagation();
        visible = !visible;
        const lockedTop = showTab.getBoundingClientRect().top;
        sidebar.classList.toggle('hidden-sidebar', !visible);
        document.body.classList.toggle('tree-hidden', !visible);
        showTab.textContent = visible ? '[Hide]' : '[Open]';
        showTab.style.setProperty('color', visible ? '#800080' : '#008000', 'important');
        mainContent.style.marginLeft = '';
        if (!visible) {
            showTab.style.setProperty('top', lockedTop + 'px', 'important');
        }
        requestAnimationFrame(function() {
            positionFloatingWindow();
            if (visible) positionLeftControls();
        });
    });
});

(function() {
    const toggle = document.getElementById('magnifierToggle');
    const lens = document.getElementById('magnifierLens');
    const body = document.body;
    let snapshot = null;
    let zoom = 1.25;
    const MIN_ZOOM = 1;
    const MAX_ZOOM = 5;
    const ZOOM_STEP = 0.10;
    const CAPTURE_SCALE = 2.5;
    let lx = 300, ly = 300, dragging = false, sx, sy, slx, sly;
    let captureInProgress = false;
    let captureQueued = false;
    const activePointers = new Map();
    let pinchStartDistance = 0;
    let pinchStartZoom = 1.25;

    function clampZoom(value) { return Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, value)); }
    function setZoom(value) { zoom = clampZoom(value); updateSnapshot(); }
    function updateSnapshot() {
        if (!snapshot) return;
        const w = lens.offsetWidth, h = lens.offsetHeight;
        const srcX = (lx + w/2) * zoom - w/2;
        const srcY = (ly + h/2) * zoom - h/2;
        snapshot.style.transform = 'translate(' + (-srcX) + 'px, ' + (-srcY) + 'px) scale(' + zoom + ')';
        snapshot.style.transformOrigin = '0 0';
    }

    async function captureScreen() {
        if (captureInProgress) { captureQueued = true; return; }
        captureInProgress = true;
        try {
            const canvas = await html2canvas(document.body, {
                useCORS: true,
                scale: CAPTURE_SCALE,
                width: window.innerWidth,
                height: window.innerHeight,
                windowWidth: window.innerWidth,
                windowHeight: window.innerHeight,
                scrollX: window.scrollX,
                scrollY: window.scrollY,
                x: window.scrollX,
                y: window.scrollY,
                ignoreElements: function(element) { return element.id === 'magnifierLens'; },
                logging: false
            });
            snapshot = canvas;
            snapshot.style.position = 'absolute';
            snapshot.style.top = '0';
            snapshot.style.left = '0';
            snapshot.style.width = window.innerWidth + 'px';
            snapshot.style.height = window.innerHeight + 'px';
            lens.innerHTML = '';
            lens.appendChild(canvas);
            const cornerIcon = document.createElement('img');
            cornerIcon.src = 'assets/magnifier-corner-icon.png';
            cornerIcon.alt = '';
            cornerIcon.id = 'magnifierCornerIcon';
            cornerIcon.setAttribute('aria-hidden', 'true');
            lens.appendChild(cornerIcon);
            updateSnapshot();
        } catch (err) {
            console.warn('Magnifier capture failed', err);
        } finally {
            captureInProgress = false;
            if (captureQueued && body.classList.contains('magnifier-mode')) {
                captureQueued = false;
                requestAnimationFrame(captureScreen);
            } else {
                captureQueued = false;
            }
        }
    }
    window._magnifier = { captureScreen: captureScreen };

    if (toggle && lens) {
        toggle.addEventListener('click', function(e) {
            e.preventDefault();
            const active = !body.classList.contains('magnifier-mode');
            body.classList.toggle('magnifier-mode', active);
            lens.classList.toggle('hidden', !active);
            if (active) {
                zoom = 1.25;
                activePointers.clear();
                pinchStartDistance = 0;
                dragging = false;
                lx = Math.max(0, Math.min(window.innerWidth - lens.offsetWidth, 300));
                ly = Math.max(0, Math.min(window.innerHeight - lens.offsetHeight, 300));
                lens.style.left = lx + 'px';
                lens.style.top = ly + 'px';
                requestAnimationFrame(function() {
                    requestAnimationFrame(captureScreen);
                });
            } else {
                activePointers.clear();
                dragging = false;
                snapshot = null;
                lens.innerHTML = '<canvas></canvas>';
            }
        });

        lens.addEventListener('pointerdown', function(e) {
            activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
            if (activePointers.size === 1) {
                dragging = true;
                sx = e.clientX; sy = e.clientY;
                slx = lx; sly = ly;
                lens.setPointerCapture(e.pointerId);
            } else if (activePointers.size === 2) {
                dragging = false;
                const points = Array.from(activePointers.values());
                pinchStartDistance = Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y);
                pinchStartZoom = zoom;
            }
        });
        lens.addEventListener('pointermove', function(e) {
            if (!activePointers.has(e.pointerId)) return;
            activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
            if (activePointers.size >= 2 && pinchStartDistance > 0) {
                const points = Array.from(activePointers.values());
                const distance = Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y);
                const ratio = distance / pinchStartDistance;
                setZoom(pinchStartZoom * (1 + (ratio - 1) * 0.5));
                return;
            }
            if (!dragging) return;
            lx = slx + (e.clientX - sx);
            ly = sly + (e.clientY - sy);
            lens.style.left = lx + 'px';
            lens.style.top = ly + 'px';
            updateSnapshot();
        });
        lens.addEventListener('pointerup', function(e) {
            activePointers.delete(e.pointerId);
            dragging = false;
            if (activePointers.size < 2) pinchStartDistance = 0;
        });
        lens.addEventListener('pointercancel', function(e) {
            activePointers.delete(e.pointerId);
            dragging = false;
            if (activePointers.size < 2) pinchStartDistance = 0;
        });

        lens.addEventListener('wheel', function(e) {
            e.preventDefault();
            setZoom(zoom + (e.deltaY < 0 ? ZOOM_STEP : -ZOOM_STEP));
        }, { passive: false });

        let scrollTimer;
        window.addEventListener('scroll', function() {
            if (body.classList.contains('magnifier-mode')) {
                clearTimeout(scrollTimer);
                scrollTimer = setTimeout(captureScreen, 200);
            }
        });
        let resizeTimer;
        window.addEventListener('resize', function() {
            if (body.classList.contains('magnifier-mode')) {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(captureScreen, 200);
            }
        });
    }
})();

(function() {
    const toggle = document.getElementById('darkModeToggle');
    const body = document.body;
    function applyDark(isDark) {
        body.classList.toggle('dark-mode', isDark);
        localStorage.setItem('darkMode', isDark);
    }
    if (localStorage.getItem('darkMode') === 'true') applyDark(true);
    if (toggle) {
        toggle.addEventListener('click', function(e) {
            e.preventDefault();
            applyDark(!body.classList.contains('dark-mode'));
        });
    }
})();

document.addEventListener('DOMContentLoaded', function() {
    const expandToggle = document.getElementById('expandImageToggle');
    if (!expandToggle) return;

    function enterExpand() {
        const img = document.querySelector('#bookshelfImageArea img');
        const toolbar = document.getElementById('tree-toolbar');
        if (!img || !toolbar) return;
        const toolbarRect = toolbar.getBoundingClientRect();
        const reserveRight = Math.max(0, window.innerWidth - toolbarRect.left);
        document.body.style.setProperty('--expand-reserve-right', reserveRight + 'px');
        document.body.classList.add('expand-image');
        expandToggle.textContent = 'X';
        requestAnimationFrame(function() {
            requestAnimationFrame(function() {
                positionFloatingWindow();
                if (document.body.classList.contains('magnifier-mode')) {
                    refreshMagnifierIfActive();
                }
            });
        });
    }
    function exitExpand() {
        document.body.classList.remove('expand-image');
        expandToggle.textContent = 'E';
        document.body.style.removeProperty('--expand-reserve-right');
        requestAnimationFrame(function() {
            requestAnimationFrame(function() {
                placeFloatingWindow();
                positionFloatingWindow();
                positionLeftControls();
                if (document.body.classList.contains('magnifier-mode')) {
                    refreshMagnifierIfActive();
                }
            });
        });
    }
    expandToggle.addEventListener('click', function(e) {
        e.preventDefault();
        if (document.body.classList.contains('expand-image')) {
            exitExpand();
        } else {
            enterExpand();
        }
    });
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && document.body.classList.contains('expand-image')) {
            exitExpand();
        }
    });
});

function placeFloatingWindow() {
    const floatingWin = document.getElementById('floating-window');
    const mainContent = document.getElementById('mainContent');
    const imageArea = document.getElementById('bookshelfImageArea');
    const mobileRow = document.getElementById('mobile-under-image');
    const toolbar = document.getElementById('tree-toolbar');
    const sidebar = document.getElementById('sidebar');
    if (!floatingWin || !mainContent || !imageArea || !toolbar || !sidebar) return;
    if (window.matchMedia('(max-width: 480px)').matches) {
        if (mobileRow) {
            if (toolbar.parentElement !== mobileRow) mobileRow.appendChild(toolbar);
            if (floatingWin.parentElement !== mobileRow) mobileRow.appendChild(floatingWin);
        }
        floatingWin.style.left = '';
        floatingWin.style.top = '';
        toolbar.style.left = '';
        toolbar.style.top = '';
        toolbar.style.position = '';
    } else {
        if (floatingWin.parentElement !== document.body) document.body.appendChild(floatingWin);
        if (toolbar.parentElement !== document.body) document.body.appendChild(toolbar);
        positionFloatingWindow();
    }
}

let desktopInfoGap = null;
let desktopStackLeft = null;

function positionFloatingWindow() {
    if (window.matchMedia('(max-width: 480px)').matches) return;
    const floatingWin = document.getElementById('floating-window');
    const toolbar = document.getElementById('tree-toolbar');
    const tree = document.getElementById('treeDropdownContent');
    const sidebar = document.getElementById('sidebar');
    const img = document.querySelector('#bookshelfImageArea img');
    if (!floatingWin || !toolbar || !tree || !sidebar || !img || floatingWin.style.display === 'none') return;

    const rect = img.getBoundingClientRect();
    const boxHeight = floatingWin.offsetHeight;

    if (!document.body.classList.contains('tree-hidden') || desktopInfoGap === null) {
        const treeRect = tree.getBoundingClientRect();
        const leftGap = Math.max(0, rect.left - treeRect.right);
        desktopInfoGap = leftGap - 5;
    }
    if (desktopStackLeft === null) {
        desktopStackLeft = rect.right + desktopInfoGap;
    }
    const stackLeft = desktopStackLeft;

    toolbar.style.position = 'fixed';
    toolbar.style.width = '76px';
    toolbar.style.margin = '0';
    toolbar.style.zIndex = '999999';

    // Set the toolbar's original image-side position only once.
    // Keep those coordinates when the image enters or leaves expand mode.
    const layoutSettings = getComputedStyle(document.documentElement);
    const toolbarWidth = parseFloat(layoutSettings.getPropertyValue('--desktop-toolbar-width')) || 76;
    const infoToolbarGapRaw = parseFloat(layoutSettings.getPropertyValue('--desktop-info-toolbar-gap'));
    const infoToolbarGap = Number.isFinite(infoToolbarGapRaw) ? infoToolbarGapRaw : 15;
    const toolbarHeight = toolbar.offsetHeight;
    toolbar.style.width = toolbarWidth + 'px';
    if (!toolbar.dataset.originalLeft || !toolbar.dataset.originalTop) {
        toolbar.dataset.originalLeft = stackLeft + 'px';
        toolbar.dataset.originalTop = (rect.bottom - toolbarHeight) + 'px';
    }
    toolbar.style.left = toolbar.dataset.originalLeft;
    toolbar.style.top = toolbar.dataset.originalTop;

    // The information panel remains above the stationary toolbar.
    floatingWin.style.left = stackLeft + 'px';
    floatingWin.style.top = (parseFloat(toolbar.dataset.originalTop) - boxHeight - infoToolbarGap) + 'px';
}

function positionLeftControls() {
    const sidebar = document.getElementById('sidebar');
    const showTab = document.getElementById('showTab');
    const tree = document.getElementById('treeDropdownContent');
    if (!sidebar || !showTab || !tree) return;

    // DESKTOP: anchor the toggle to the actual link-tree position.
    // If the tree is hidden, keep the toggle at its last position.
    if (!window.matchMedia('(max-width: 480px)').matches) {
        if (document.body.classList.contains('tree-hidden')) return;

        const treeRect = tree.getBoundingClientRect();
        if (!treeRect.width || !treeRect.height) return;

        const layoutSettings = getComputedStyle(document.documentElement);
        const isGalleryPage = document.body.classList.contains('image-open');
        const offsetXRaw = parseFloat(layoutSettings.getPropertyValue(
            isGalleryPage ? '--desktop-toggle-offset-x' : '--home-toggle-offset-x'
        ));
        const offsetYRaw = parseFloat(layoutSettings.getPropertyValue(
            isGalleryPage ? '--desktop-toggle-offset-y' : '--home-toggle-offset-y'
        ));
        const offsetX = Number.isFinite(offsetXRaw) ? offsetXRaw : 7;
        const offsetY = Number.isFinite(offsetYRaw) ? offsetYRaw : 2;
        showTab.style.setProperty('left', (treeRect.left + offsetX) + 'px', 'important');
        showTab.style.setProperty('top', (treeRect.top - showTab.offsetHeight - offsetY) + 'px', 'important');
        return;
    }

    // MOBILE: retain the existing image-relative positioning behaviour.
    const img = document.querySelector('#bookshelfImageArea img');
    const intro = document.getElementById('intro-text');
    const target = img || intro;
    if (!target) return;

    const rect = target.getBoundingClientRect();
    const treeStyle = window.getComputedStyle(tree);
    const layoutSettings = getComputedStyle(document.documentElement);
    const treePaddingTop = parseFloat(treeStyle.paddingTop) || 0;
    const sidebarOffsetYRaw = parseFloat(layoutSettings.getPropertyValue('--mobile-sidebar-offset-y'));
    const sidebarOffsetY = Number.isFinite(sidebarOffsetYRaw) ? sidebarOffsetYRaw : 0;
    const groupTop = Math.max(0, rect.top - treePaddingTop + sidebarOffsetY);

    sidebar.style.setProperty('top', groupTop + 'px', 'important');
    if (!document.body.classList.contains('tree-hidden')) {
        const treeRect = tree.getBoundingClientRect();
        const offsetXRaw = parseFloat(layoutSettings.getPropertyValue('--mobile-toggle-offset-x'));
        const offsetYRaw = parseFloat(layoutSettings.getPropertyValue('--mobile-toggle-offset-y'));
        const offsetX = Number.isFinite(offsetXRaw) ? offsetXRaw : 7;
        const offsetY = Number.isFinite(offsetYRaw) ? offsetYRaw : 2;
        showTab.style.setProperty('left', (treeRect.left + offsetX) + 'px', 'important');
        showTab.style.setProperty('top', (treeRect.top - showTab.offsetHeight - offsetY) + 'px', 'important');
    }
}

window.addEventListener('resize', function() {
    if (window.matchMedia('(max-width: 480px)').matches) {
        placeFloatingWindow();
        positionLeftControls();
        return;
    }
    desktopStackLeft = null;
    if (document.body.classList.contains('expand-image')) {
        const toolbar = document.getElementById('tree-toolbar');
        if (toolbar) {
            const toolbarRect = toolbar.getBoundingClientRect();
            document.body.style.setProperty('--expand-reserve-right', Math.max(0, window.innerWidth - toolbarRect.left) + 'px');
        }
    }
    placeFloatingWindow();
    positionFloatingWindow();
    positionLeftControls();
});

window.addEventListener('load', async function() {
    await loadImageMetadata();
    globalImageList = buildGlobalImageList();
    originalImageList = globalImageList.slice();
    globalCurrentIndex = 0;

    buildTreeDropdown();
    updateSortByButton();
    placeFloatingWindow();
    requestAnimationFrame(positionLeftControls);

    const floatingWin = document.getElementById('floating-window');
    if (floatingWin) floatingWin.style.display = 'none';
    if (!window.matchMedia('(max-width: 480px)').matches) {
        const toolbar = document.getElementById('tree-toolbar');
        if (toolbar) toolbar.style.display = 'none';
    }

    requestAnimationFrame(positionLeftControls);

    if ('requestIdleCallback' in window) {
        requestIdleCallback(preloadFirstImages);
    } else {
        setTimeout(preloadFirstImages, 250);
    }

});
</script>
